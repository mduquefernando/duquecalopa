<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIRAL</title>
  <style>
:root {
  --bg: #dde3ee;
  --ink: #0d1a2b;
  --muted: #5e6f86;
  --accent: #1c63ff;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: "Space Grotesk", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 14%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 38%),
    linear-gradient(160deg, #dfe5ef 0%, #d8e0ec 46%, #d3dce9 100%);
  cursor: none;
}

.desktop {
  width: 100%;
  height: 100%;
  padding: 1.1rem 1.2rem;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  position: relative;
  height: auto;
  width: fit-content;
  max-width: min(520px, 82vw);
  margin: 0;
  --logo-ink-width: 100%;
}

.viral-logo {
  margin: 0;
  width: min(520px, 82vw);
  height: 82px;
  position: relative;
  animation: none;
  filter: blur(0.15px);
}

.logo-dot {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #141414;
  opacity: 1;
  box-shadow: none;
  animation: none;
}

.intro-line {
  margin: 0.4rem 0 0;
  width: var(--logo-ink-width);
  max-width: var(--logo-ink-width);
  font-family: "Courier Prime", "Courier New", monospace;
  font-size: clamp(0.76rem, 1.45vw, 1rem);
  line-height: 1.32;
  color: #0f1012;
  letter-spacing: 0.01em;
  text-wrap: wrap;
  overflow-wrap: anywhere;
  text-align: center;
}

.tech-strip {
  margin-top: 0.85rem;
  width: var(--logo-ink-width);
  max-width: var(--logo-ink-width);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.35rem;
  font-family: "Courier New", monospace;
  font-size: 0.62rem;
  color: #0f0f0f;
  filter: contrast(1.1);
}

.tag,
.mark {
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 0.45rem;
  border: 2px solid #111;
  background: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.04em;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
}

.tag {
  font-weight: 700;
  border-radius: 2px;
}

.mark {
  border-radius: 999px;
  min-width: 22px;
  font-weight: 700;
}

.circle-v {
  width: 22px;
  min-width: 22px;
  border-radius: 50%;
  padding: 0;
  font-weight: 800;
  font-size: 0.7rem;
}

.mark:nth-child(7) {
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}

.tri-bolt {
  width: 22px;
  min-width: 22px;
  padding: 0;
  border-radius: 4px;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  position: relative;
  background: rgba(255, 255, 255, 0.78);
}

.tri-bolt::before {
  content: "";
  position: absolute;
  width: 4px;
  height: 8px;
  background: #0f0f0f;
  clip-path: polygon(45% 0%, 100% 0%, 55% 45%, 100% 45%, 0% 100%, 40% 55%, 0% 55%);
  top: 8px;
  left: 9px;
}

.ring-10 {
  width: 26px;
  min-width: 26px;
  padding: 0;
  position: relative;
}

.ring-10::before {
  content: "10";
  font-size: 0.56rem;
}

.ring-10::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 2px solid #111;
  border-radius: 50%;
  border-right-color: transparent;
  transform: rotate(-25deg);
}

.clock-overlay {
  position: fixed;
  right: 1.2rem;
  top: 1rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-align: right;
  border: 1px solid #8ca0bb;
  background: rgba(232, 236, 242, 0.9);
  border-radius: 12px;
  padding: 0.45rem 0.58rem;
  box-shadow: 0 6px 14px rgba(43, 61, 91, 0.16);
}

.clock-time {
  position: relative;
  width: 78px;
  height: 22px;
  margin-left: auto;
}

.clock-date {
  margin-top: 0.1rem;
  font-family: "Courier New", monospace;
  font-size: 0.72rem;
  color: #303030;
}

.clock-copy {
  display: flex;
  flex-direction: column;
}

.pixel-face {
  width: 28px;
  height: 28px;
  border: 2px solid #1a1a1a;
  border-radius: 50%;
  background: #f1f1f1;
  position: relative;
  image-rendering: pixelated;
}

.eye {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #1a1a1a;
  top: 8px;
}

.eye-left {
  left: 5px;
  width: 5px;
  height: 2px;
  top: 10px;
}
.eye-right {
  right: 5px;
  width: 5px;
  height: 2px;
  top: 10px;
}

.blush {
  position: absolute;
  width: 4px;
  height: 3px;
  background: #f3a9b2;
  top: 14px;
  opacity: 0.95;
}

.blush-left { left: 4px; }
.blush-right { right: 4px; }

.mouth {
  position: absolute;
  width: 6px;
  height: 6px;
  left: 50%;
  transform: translateX(-50%);
  bottom: 6px;
  background: transparent;
  border: 2px solid #1a1a1a;
  border-radius: 50%;
}

.mouth::after {
  content: none;
}

.clock-dot {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #151515;
}

.grid {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.4rem;
}

.icon-btn {
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  text-align: center;
  transition: transform 140ms ease, filter 140ms ease;
  min-width: 120px;
}

.icon-btn:hover {
  transform: translateY(-4px);
  filter: brightness(1.03);
}

.icon {
  width: 86px;
  height: 66px;
  margin: 0 auto;
  border-radius: 10px;
  position: relative;
  background: linear-gradient(180deg, #6fb2ff 0%, #2f7eff 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.52),
    0 16px 26px rgba(35, 93, 173, 0.25);
}

.icon::before {
  content: "";
  position: absolute;
  left: 8px;
  top: -8px;
  width: 36px;
  height: 14px;
  border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, #85c0ff 0%, #5fa9ff 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.label {
  margin-top: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  font-size: 0.82rem;
  color: #0f1c2f;
}

.folder-view {
  margin-top: 1.2rem;
  border: 1px solid #bac8db;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(7px);
  padding: 0.95rem 1rem;
}

.folder-tabs-wrap {
  position: absolute;
  top: 4.1rem;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  display: flex;
  justify-content: center;
  z-index: 20;
}

.folder-tabs {
  width: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 0.7rem;
}

.folder-tab-btn {
  min-width: 0;
  width: 82px;
}

.folder-tab-btn .icon {
  width: 58px;
  height: 44px;
  border-radius: 8px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.52),
    0 10px 18px rgba(35, 93, 173, 0.2);
}

.folder-tab-btn .icon::before {
  left: 6px;
  top: -6px;
  width: 24px;
  height: 10px;
}

.folder-tab-btn .label {
  margin-top: 0.45rem;
  font-size: 0.7rem;
}

.folder-tab-btn.is-active .icon {
  filter: saturate(1.12) brightness(1.03);
}

.folder-tab-btn.is-active .label {
  color: #0a3f8f;
}

.folder-content {
  color: #20344f;
  line-height: 1.45;
}

.folder-view[data-folder="work"] {
  background:
    radial-gradient(circle at 12% -18%, rgba(109, 144, 198, 0.22), transparent 42%),
    radial-gradient(circle at 90% -24%, rgba(197, 177, 149, 0.25), transparent 47%),
    #eef1f5;
  border-color: #cfd6e2;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.45),
    0 25px 44px rgba(30, 45, 66, 0.18);
  padding: 0.8rem 0.8rem 1rem;
}

.folder-view[data-folder="work"] .folder-head h2 {
  color: #2a3648;
  letter-spacing: 0.03em;
}

.folder-view[data-folder="work"] .folder-content {
  color: #4a596f;
}

.work-reel {
  margin-top: 0.7rem;
  display: grid;
  gap: 0.8rem;
}

.work-reel-row {
  min-height: 92vh;
  display: grid;
  grid-template-columns: 2.1fr 1fr;
  gap: 0.8rem;
}

.work-reel-row.single-row {
  grid-template-columns: 1fr;
}

.work-reel-row.vertical-pair-row {
  min-height: auto;
  display: flex;
  justify-content: center;
  align-items: stretch;
  gap: 0.35rem;
}

.work-video-card {
  margin: 0;
  display: block;
  position: relative;
  cursor: pointer;
  background: #d5dae0;
  border: 1px solid #ced6e2;
  border-radius: 2px;
  overflow: hidden;
  box-shadow:
    0 8px 12px rgba(45, 58, 79, 0.15),
    inset 0 0 0 1px rgba(255, 255, 255, 0.24);
  transition: transform 180ms ease, box-shadow 180ms ease;
}

.work-video-card:hover {
  transform: translateY(-2px);
  box-shadow:
    0 14px 20px rgba(56, 77, 109, 0.18),
    inset 0 0 0 1px rgba(255, 255, 255, 0.42);
}

.work-video-card.is-portrait {
  filter: saturate(0.98);
}

.work-video-card.is-featured {
  border-color: #bcc6d2;
  box-shadow:
    0 10px 16px rgba(45, 58, 79, 0.19),
    inset 0 0 0 1px rgba(255, 255, 255, 0.34);
}

.work-reel-card {
  aspect-ratio: 16 / 9;
}

.work-reel-card.is-tall {
  aspect-ratio: 9 / 16;
  max-height: 100%;
}

.work-reel-row .work-reel-card {
  width: 100%;
}

.work-reel-row.single-row .work-reel-card {
  aspect-ratio: 16 / 9;
}

.work-reel-row.vertical-pair-row .work-reel-card {
  aspect-ratio: 9 / 16;
  max-width: min(44vw, 46vh);
}

.work-video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #000;
}

.work-video-overlay {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0.7rem 0.75rem 0.58rem;
  background: linear-gradient(to top, rgba(8, 12, 16, 0.82), rgba(8, 12, 16, 0.08) 68%, transparent);
}

.work-video-name {
  margin: 0;
  font-size: 0.72rem;
  color: #f2f6ff;
  font-family: "Space Grotesk", "Segoe UI", sans-serif;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
}

.work-modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(8, 12, 18, 0.78);
}

.work-modal-shell {
  width: min(980px, 94vw);
  background: #0e1118;
  border-radius: 14px;
  border: 1px solid #2c3748;
  padding: 0.95rem;
  box-shadow: 0 26px 50px rgba(0, 0, 0, 0.5);
}

.work-modal-video {
  width: 100%;
  max-height: 76vh;
  border-radius: 10px;
  background: #000;
}

.work-modal-label {
  margin: 0.55rem 0 0;
  color: #d9e1ef;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.work-contact-panel {
  margin-top: 1rem;
  margin-bottom: 0.3rem;
  border: none;
  border-radius: 0;
  padding: 1rem 0;
  background: transparent;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.work-contact-kicker {
  margin: 0;
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.78);
}

.work-contact-title {
  margin: 0.45rem 0 0.45rem;
  font-size: clamp(1.2rem, 1.4rem + 0.2vw, 1.6rem);
  color: #ffffff;
}

.work-contact-copy {
  margin: 0;
  max-width: 72ch;
  width: min(72ch, 100%);
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.82);
  margin-left: auto;
  margin-right: auto;
}

.work-contact-cta {
  width: min(860px, 100%);
  margin-top: 1rem;
  padding: 1.2rem 1rem;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 16px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015)),
    repeating-linear-gradient(
      100deg,
      rgba(255, 255, 255, 0.045) 0,
      rgba(255, 255, 255, 0.045) 1px,
      transparent 1px,
      transparent 9px
    );
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.work-contact-cta-copy {
  margin: 0;
  font-size: clamp(0.98rem, 0.92rem + 0.72vw, 1.38rem);
  line-height: 1.15;
  color: #e7edf8;
  text-wrap: balance;
}

.work-contact-email-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0.55rem 1.2rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.32);
  background: rgba(255, 255, 255, 0.88);
  color: #111827;
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: transform 140ms ease, box-shadow 140ms ease;
}

.work-contact-email-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
}

.work-contact-row {
  min-height: auto;
}

.work-modal-close {
  position: fixed;
  top: 1rem;
  right: 1rem;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid #3b4a61;
  background: #0f1520;
  color: #edf3ff;
  font-size: 1.05rem;
  cursor: pointer;
}

body.modal-open {
  overflow: hidden;
}

.about-panel {
  max-width: 940px;
  border: 1px solid #a9b7ce;
  border-radius: 16px;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(242, 247, 255, 0.86)),
    repeating-linear-gradient(
      90deg,
      rgba(26, 57, 92, 0.07) 0,
      rgba(26, 57, 92, 0.07) 1px,
      transparent 1px,
      transparent 9px
    );
  box-shadow:
    0 24px 40px rgba(35, 58, 93, 0.18),
    inset 0 0 0 1px rgba(255, 255, 255, 0.7);
}

.about-headline {
  padding: 0.95rem 1rem 0.8rem;
  background:
    radial-gradient(circle at 12% -20%, rgba(39, 112, 246, 0.2), transparent 44%),
    linear-gradient(120deg, #101c2d 0%, #182a43 52%, #0f2237 100%);
  color: #dce8ff;
}

.about-kicker {
  margin: 0;
  font-family: "Courier New", monospace;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.66rem;
  color: #95b8ef;
}

.about-title {
  margin: 0.42rem 0 0.5rem;
  font-family: "Courier New", monospace;
  font-size: clamp(1.1rem, 2.8vw, 2rem);
  letter-spacing: 0.12em;
  line-height: 1.05;
  color: #f5f9ff;
  text-transform: uppercase;
  text-shadow: 0 0 14px rgba(101, 160, 255, 0.34);
}

.about-dotline {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(24, 8px);
  gap: 6px;
}

.about-dotline span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #d5e5ff;
  opacity: 0.88;
  animation: pulseDot 2.8s ease-in-out infinite;
}

.about-dotline span:nth-child(3n) {
  animation-delay: 180ms;
}

.about-dotline span:nth-child(4n) {
  animation-delay: 350ms;
}

.about-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(230px, 1fr);
  gap: 1rem;
  padding: 1rem;
}

.about-main {
  position: relative;
  border: 1px solid #bdcae0;
  border-radius: 12px;
  padding: 0.9rem 0.95rem;
  background: rgba(250, 252, 255, 0.85);
}

.about-main::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 12px;
  background: repeating-linear-gradient(
    to bottom,
    rgba(20, 47, 79, 0.06) 0,
    rgba(20, 47, 79, 0.06) 1px,
    transparent 1px,
    transparent 7px
  );
  mix-blend-mode: multiply;
}

.about-main h4 {
  margin: 0 0 0.62rem;
  font-family: "Courier New", monospace;
  font-size: 0.93rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #152a45;
}

.about-main p {
  margin: 0 0 0.62rem;
  max-width: 68ch;
  color: #203958;
  font-size: 0.92rem;
  line-height: 1.6;
}

.about-main p:last-child {
  margin-bottom: 0;
}

.about-spec {
  border: 1px solid #b6c8e4;
  border-radius: 12px;
  padding: 0.78rem 0.82rem;
  background: linear-gradient(180deg, #eff5ff 0%, #e9f0fb 100%);
}

.about-spec-title {
  margin: 0 0 0.62rem;
  font-family: "Courier New", monospace;
  text-transform: uppercase;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: #325382;
}

.about-icons {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 0.45rem;
  color: #1f3655;
  font-family: "Courier New", monospace;
  font-size: 0.8rem;
}

.about-icons li {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 1px dashed rgba(49, 85, 133, 0.34);
  padding-bottom: 0.34rem;
}

.about-icons li:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.about-icons span {
  color: #0a63dd;
  font-weight: 700;
}

.about-contacts {
  width: 100%;
  max-width: none;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(220px, 360px));
  justify-content: center;
  align-items: center;
  gap: 0.9rem 2.4rem;
  padding: 2rem 1rem;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.about-contact {
  width: min(360px, 42vw);
  border: 0;
  border-radius: 0;
  padding: 0;
  text-align: center;
  background: transparent;
}

.about-avatar {
  width: 72px;
  height: 72px;
  margin: 0 auto 0.6rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 1.7rem;
  border: 1px solid #555;
  background: #181818;
}

.about-avatar-blue {
  width: 84px;
  height: 84px;
  position: relative;
  border: 1px solid #5ea2ff;
  background:
    radial-gradient(circle at 50% 42%, #78b9ff 0%, #2e6fca 45%, #0f2d59 80%, #0a1830 100%);
  box-shadow:
    0 0 18px rgba(92, 161, 255, 0.55),
    inset 0 -10px 18px rgba(8, 20, 44, 0.55);
  overflow: visible;
}

.about-avatar-blue::before,
.about-avatar-blue::after {
  content: "";
  position: absolute;
  top: 38px;
  width: 16px;
  height: 22px;
  border-radius: 50% 50% 45% 45%;
  background: linear-gradient(180deg, #6fb3ff 0%, #1d56a5 100%);
  box-shadow: 0 0 10px rgba(94, 162, 255, 0.45);
}

.about-avatar-blue::before {
  left: -10px;
  transform: rotate(-24deg);
}

.about-avatar-blue::after {
  right: -10px;
  transform: rotate(24deg);
}

.about-avatar-blue .face-eye {
  position: absolute;
  top: 34px;
  width: 10px;
  height: 7px;
  border-radius: 50%;
  background: #04070d;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
}

.about-avatar-blue .face-eye.left {
  left: 24px;
}

.about-avatar-blue .face-eye.right {
  right: 24px;
}

.about-avatar-blue .face-nose {
  position: absolute;
  left: 50%;
  top: 45px;
  width: 5px;
  height: 8px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: rgba(196, 225, 255, 0.5);
}

.about-avatar-blue .face-mouth {

const WORK_DOT_COORDS = [

  [2, 9],[11, 9],[14, 8],[15, 8],[16, 8],[17, 8],[18, 8],[19, 8],[20, 8],

  [1, 13],[4, 13],[7, 13],[11, 13],[14, 11],[15, 11],[16, 11],[17, 11],[18, 11],[21, 11],
  [2, 14],[3, 14],[4, 14],[7, 14],[8, 14],[9, 14],[11, 14],[14, 12],[18, 12],[21, 12]

const folders = {
  work: {
    title: "WORK",
    content: ""
  },
  about: {

    content: `

};

function renderFolderTabs(activeKey) {
  folderTabs.innerHTML = Object.entries(folders)
    .map(([key, folder]) => `
      <button
        class="icon-btn folder-tab-btn ${key === activeKey ? "is-active" : ""}"

  folderTabs.querySelectorAll(".folder-tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => openFolder(btn.dataset.folder));
  });
}

function openFolder(key) {
  const folder = folders[key];
  if (!folder) return;

  if (workVideoObserver) {
    workVideoObserver.disconnect();
    workVideoObserver = null;
  }
  closeWorkVideoModal();

  folderView.dataset.folder = key;
  renderFolderTabs(key);

  if (key === "work") {
    folderContent.innerHTML = renderWorkContent();
    setupWorkVideoPlayback();
  } else {
    folderContent.innerHTML = folder.content;
  }
}

function renderWorkContent() {
  if (WORK_VIDEO_FILES.length === 0) {
    return `
      <p>Bienvenido a <strong>WORK</strong>.</p>
      <p>
        Añade tus videos en <code>media/work-videos/</code> y luego incluye sus nombres
        en <code>WORK_VIDEO_FILES</code> dentro de <code>app.js</code>.
      </p>
    `;
  }

  const buildVideoCard = (fileName) => {
    const safeName = encodeURIComponent(fileName).replace(/%2F/g, "/");
    const cleanLabel = fileName.replace(/-web(?=\.[^.]+$)/, "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ");
    const cardClass = FEATURED_VIDEO_FILES.has(fileName)
      ? "work-video-card is-featured"
      : "work-video-card";
    const orientationClass = VERTICAL_VIDEO_FILES.has(fileName) ? "is-tall" : "is-wide";
    return `
      <article
        class="${cardClass} work-reel-card ${orientationClass}"
        data-video-src="media/work-videos/${safeName}"
        data-video-label="${cleanLabel}"
      >
        <video
          class="work-video"
          src="media/work-videos/${safeName}"
          autoplay
          loop
          muted
          playsinline
          preload="metadata"
        ></video>
        <div class="work-video-overlay">
          <p class="work-video-name">${cleanLabel}</p>
        </div>
      </article>
    `;
  };

  const verticalVideos = WORK_VIDEO_FILES.filter((fileName) => VERTICAL_VIDEO_FILES.has(fileName));
  const horizontalVideos = WORK_VIDEO_FILES.filter((fileName) => !VERTICAL_VIDEO_FILES.has(fileName));

  const rows = horizontalVideos.map((fileName) => `
    <section class="work-reel-row single-row">
      ${buildVideoCard(fileName)}
    </section>
  `);

  if (verticalVideos.length > 0) {
    rows.push(`
      <section class="work-reel-row vertical-pair-row">
        ${verticalVideos.map((fileName) => buildVideoCard(fileName)).join("")}
      </section>
    `);
  }

  rows.push(`

      <section class="work-contact-panel" aria-labelledby="workContactTitle">
        <p class="work-contact-kicker">CONTACT US</p>

        <div class="work-contact-cta">

          <a
            class="work-contact-email-btn"
            href="mailto:duquecalopawork@gmail.com"

}

function openWorkVideoModal(src, label) {
  const modal = document.getElementById("workVideoModal");
  const modalVideo = document.getElementById("workModalVideo");
  const modalLabel = document.getElementById("workModalLabel");
  if (!modal || !modalVideo || !modalLabel || !src) return;

  activeModalVideo = modalVideo;
  modalVideo.src = src;
  modalVideo.currentTime = 0;
  modalVideo.muted = false;
  modalVideo.play().catch(() => {});
  modalLabel.textContent = label || "";
  modal.classList.remove("hidden");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
}

function closeWorkVideoModal() {
  const modal = document.getElementById("workVideoModal");
  if (!modal) return;

  if (activeModalVideo) {
    activeModalVideo.pause();
    activeModalVideo.removeAttribute("src");
    activeModalVideo.load();
  }
  activeModalVideo = null;
  modal.classList.add("hidden");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
}

function updateClock() {
  const now = new Date();
  const timeText = now.toLocaleTimeString("es-ES", {
    hour: "2-digit",
    minute: "2-digit"
  });
  if (timeText !== lastTimeText) {
    renderDotMatrixTime(clockTime, timeText);
    lastTimeText = timeText;
  }
  clockDate.textContent = now.toLocaleDateString("es-ES", {
    weekday: "short",
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function renderDotMatrixTime(target, text) {
  const glyphs = {
    "0": ["111", "101", "101", "101", "111"],
    "1": ["010", "110", "010", "010", "111"],
    "2": ["111", "001", "111", "100", "111"],
    "3": ["111", "001", "111", "001", "111"],
    "4": ["101", "101", "111", "001", "001"],
    "5": ["111", "100", "111", "001", "111"],
    "6": ["111", "100", "111", "101", "111"],
    "7": ["111", "001", "010", "010", "010"],
    "8": ["111", "101", "111", "101", "111"],
    "9": ["111", "101", "111", "001", "111"],
    ":": ["0", "1", "0", "1", "0"]
  };

  const dotPitch = 4;
  let col = 0;
  target.innerHTML = "";

  for (const ch of text) {
    const g = glyphs[ch];
    if (!g) continue;
    const gw = g[0].length;
    for (let y = 0; y < g.length; y++) {
      for (let x = 0; x < gw; x++) {
        if (g[y][x] === "1") {
          const dot = document.createElement("span");
          dot.className = "clock-dot";
          dot.style.left = `${(col + x) * dotPitch}px`;
          dot.style.top = `${y * dotPitch}px`;
          target.appendChild(dot);
        }
      }
    }
    col += gw + 1;
  }
}

function renderPointCloudLogo() {
  const lines = ["eloi calopa", "fernando duque"];
  const width = Math.min(520, Math.floor(window.innerWidth * 0.82));
  const height = 112;
  const step = 5;

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (!ctx) {
    viralLogo.textContent = text;
    return;
  }

  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#000";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  const fontSize = Math.floor(height * 0.39);
  const lineGap = Math.floor(height * 0.06);
  ctx.font = `700 ${fontSize}px "Courier New", monospace`;
  lines.forEach((line, index) => {
    const y = index * (fontSize + lineGap);
    ctx.fillText(line, 0, y);
  });

  const data = ctx.getImageData(0, 0, width, height).data;
  viralLogo.innerHTML = "";
  viralLogo.style.width = `${width}px`;
  viralLogo.style.height = `${height}px`;

  let maxDotX = 0;
  for (let y = 0; y < height; y += step) {
    for (let x = 0; x < width; x += step) {
      const p = (y * width + x) * 4 + 3;
      if (data[p] > 120) {
        const dot = document.createElement("span");
        const px = x;
        const py = y;
        dot.className = "logo-dot";
        dot.style.left = `${px}px`;
        dot.style.top = `${py}px`;
        viralLogo.appendChild(dot);
        if (px > maxDotX) maxDotX = px;
      }
    }
  }
  const inkWidth = Math.min(width, maxDotX + 6);
  topbar.style.setProperty("--logo-ink-width", `${inkWidth}px`);
}

function scheduleLogoRender() {
  if (logoRaf) {
    cancelAnimationFrame(logoRaf);
  }
  logoRaf = requestAnimationFrame(() => {
    renderPointCloudLogo();
    logoRaf = 0;
  });
}

function setupWorkVideoPlayback() {
  const videos = folderContent.querySelectorAll(".work-video");
  if (videos.length === 0) return;

  videos.forEach((video) => {
    const applyAspect = () => {
      if (!video.videoWidth || !video.videoHeight) return;
      const card = video.closest(".work-video-card");
      if (!card) return;
      const ratio = video.videoWidth / video.videoHeight;
      const isPortrait = ratio < 0.95;
      card.classList.toggle("is-portrait", isPortrait);
    };
    if (video.readyState >= 1) {
      applyAspect();
    } else {
      video.addEventListener("loadedmetadata", applyAspect, { once: true });
    }
  });

  if (!("IntersectionObserver" in window)) {
    videos.forEach((video) => {
      video.play().catch(() => {});
    });
    return;
  }

  workVideoObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio > 0.45) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    });
  }, { threshold: [0, 0.45, 0.75] });

  videos.forEach((video) => workVideoObserver.observe(video));
}

function setupCustomCursor() {
  if (window.matchMedia("(pointer: coarse)").matches) return;

  const cursor = document.createElement("div");
  cursor.className = "custom-cursor";
  document.body.appendChild(cursor);

  window.addEventListener("mousemove", (event) => {
    cursor.style.left = `${event.clientX}px`;
    cursor.style.top = `${event.clientY}px`;
    cursor.classList.add("is-visible");
  });

  window.addEventListener("mousedown", () => cursor.classList.add("is-pressed"));
  window.addEventListener("mouseup", () => cursor.classList.remove("is-pressed"));
  document.addEventListener("mouseleave", () => cursor.classList.remove("is-visible"));
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeWorkVideoModal();
  }
});

openFolder("work");
updateClock();
setInterval(updateClock, 1000);
renderPointCloudLogo();
window.addEventListener("resize", scheduleLogoRender);
setupCustomCursor();





  </script>
