<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIRAL | Desktop</title>
  <link rel="stylesheet" href="styles.css?v=20260530-1" />
</head>
<body>
  <main class="desktop">
    <header class="topbar">
      <h1 id="viralLogo" class="viral-logo" aria-label="viral.com"></h1>
      <p class="intro-line">You have reached the creative technical universe of Fernando Duque and Eloi Calopa. Enjoy :)</p>
    </header>
    <aside class="clock-overlay" aria-live="polite">
      <div class="pixel-face" aria-hidden="true">
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="blush blush-left"></span>
        <span class="blush blush-right"></span>
        <span class="mouth"></span>
      </div>
      <div class="clock-copy">
        <div id="clockTime" class="clock-time"></div>
        <div id="clockDate" class="clock-date"></div>
      </div>
    </aside>

    <div class="folder-tabs-wrap">
      <nav id="folderTabs" class="folder-tabs" aria-label="Secciones"></nav>
    </div>

    <section id="folderView" class="folder-view">
      <div id="folderContent" class="folder-content"></div>
    </section>
  </main>

  <script type="module" src="app.js?v=20260530-1"></script>
</body>
</html>
